name: Deploy Lambda Function
on: [push]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8
      - name: Install libraries
        run: pip install flake8
      - name: Lint with flake8
        run: |
            cd function
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8
      - name: Install libraries
        run: |
            cd function
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi 
      - name: Zip bundle
        run: |
            cd function
            zip -r ../${{ github.sha }}.zip .
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipped-bundle
          path: ${{ github.sha }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: zipped-bundle
      - name: create release
        id: create_release
        uses: softprops/action-gh-release@v2
      #  if: startsWith(github.ref, 'refs/tags/') # "Only run upon creation of a new Git tag."
        # env:
        #   GITHUB_TOKEN: ${{ secrets.github_token }} # this token is provided by actions automatically.
        with:
          tag_name: ${{ github.run_number }}
          name: Release ${{ github.run_number }}  # release_name
          body: New Release for ${{ github.sha }}. Release notes can be Found in the Docs.
          draft: false
          prerelease: false
          files: ${{ github.sha }}.zip
  documentation: 
    runs-on: ubuntu-latest
    needs : lint
    steps: 
      - name: Check out code
        uses: actions/checkout@v2
      - names: create docs folder
        run:  mkdir docs
      - name: convert md html
        uses: docker://pandoc/core:3.5  
        with:
          args: userguid.md -t html -o docs/index.html
      - names: deploy site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          git-config-email: <>





